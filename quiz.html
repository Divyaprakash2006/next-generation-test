
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Quiz Test</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <!-- Header -->
    <header style="background-color: aliceblue; padding: 10px;">
        <img
            src="./logo.svg"
            style="width: 170px; height: 35px; object-fit: contain; display: block;"
            alt="Quiz Logo"
        >
    </header>


    <!-- Password Screen -->
    <div id="passwordScreen" style="display:none;">

        <h3>Enter Test Password</h3>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your full name"
            required
        >

        <input
            type="password"
            id="testPassword"
            placeholder="Enter password"
        >

        <button type="button" onclick="verifyPassword()">
            Submit Password
        </button>

        <p id="passwordMessage" style="color:red;"></p>

    </div>


    <!-- Start Screen -->
    <div id="startScreen">

        <p>Test your knowledge!</p>

        <h1 id="displayQuizTitle"></h1>

        <button type="button" onclick="showPasswordScreen()">
            Start Test
        </button>

    </div>


    <!-- Empty State: Shown when admin has not imported questions -->
    <section id="noQuestions" class="empty-state" style="display:none;">
        <img src="./no-questions.svg" alt="No questions available" class="empty-state-image">
        <h2>No Questions Available In Server</h2>
        <p id="noQuestionsText">please Contact your administrator.</p>
    </section>


    <!-- Quiz Screen -->
    <div id="quizScreen" style="display:none;">

        <p id="questionNumber"></p>

        <h3 id="question"></h3>

        <div id="options"></div>

        <h3 id="feedback"></h3>

        <button
            type="button"
            id="clearBtn"
            onclick="clearAnswer()"
            disabled
        >
            Clear
        </button>

        <button
            type="button"
            id="submitBtn"
            onclick="checkAnswer()"
            disabled
        >
            Submit Answer
        </button>

        <button
            type="button"
            id="previousBtn"
            onclick="previousQuestion()"
            style="display:none;"
        >
            Previous
        </button>

        <button
            type="button"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;"
        >
            Next
        </button>

        <button
            type="button"
            id="cancelBtn"
            onclick="cancelTest()"
            style="display:none;"
        >
            Cancel Test
        </button>

    </div>


    <!-- Confirmation Box -->
    <div id="confirmBox" style="display:none;">

        <p id="confirmMessage"></p>

        <button type="button" onclick="confirmYes()">
            Yes
        </button>

        <button type="button" onclick="confirmNo()">
            No
        </button>

    </div>


    <!-- Custom Message -->
    <div id="customMessage" style="display:none; text-align:center;">

        <p id="messageText"></p>

        <button type="button" onclick="closeMessage()">
            OK
        </button>

    </div>


    <!-- Result Screen -->
    <div id="resultScreen" style="display:none;">

        <h2 id="resultMessage">Test Completed!</h2>

        <div id="resultDetails">

            <p>
                Your Score:
                <span id="finalScore"></span>
            </p>

            <p>
                Percentage:
                <span id="finalPercentage"></span>
            </p>

        </div>


        <!-- Thank You Banner: Default -->
        <div id="thankYouMessage" style="display:none;">

            <h2>Thank You!</h2>

            <p>Your test has been completed successfully.</p>

            <p>Your answers have been submitted.</p>

        </div>

        <!-- Answer Review: Only when Admin enables it -->
        <div id="answerReview" style="display:none;"></div>
    </div>


    <!-- JavaScript -->
    <script src="quiz.js"></script>

</body>
</html>
